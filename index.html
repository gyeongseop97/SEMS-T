<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEMS-T | ESG Data Hub</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#6b778c;--line:#dfe7f1;--brand:#173f69;--brand2:#2f6faa;--green:#0f8f69;--amber:#e8991d;--red:#d64545;--blueSoft:#eef6ff;--greenSoft:#edf9f5;--redSoft:#fff0f0;--shadow:0 18px 45px rgba(23,32,51,.08);--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif}button,input,select,textarea{font-family:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,#122338,#18385d);color:white;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.logo{display:flex;gap:12px;align-items:center;margin-bottom:24px;padding:8px 10px}.logoMark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6bb7ff,#20c997);display:grid;place-items:center;font-weight:900;color:#092033}.logo b{display:block;font-size:20px}.logo span{display:block;color:#c8d8ec;font-size:12px;margin-top:3px;line-height:1.35}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#dce9f7;text-align:left;padding:13px 14px;border-radius:14px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.13);color:white}.nav small{margin-left:auto;color:#aac3df;font-weight:800}.sideNote{margin-top:22px;padding:16px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);border-radius:18px;color:#d7e7f7;font-size:13px;line-height:1.55}.main{padding:24px 28px 54px;min-width:0}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.topbar h1{margin:0;font-size:25px}.topbar p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.tools{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;background:var(--brand);color:white;padding:11px 14px;font-weight:900}.btn.secondary{background:white;color:var(--brand);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.small{padding:8px 10px;font-size:12px}.hidden{display:none!important}.filters{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;background:white;border:1px solid var(--line);padding:14px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}.field label{display:block;font-size:12px;font-weight:900;color:#4c5b70;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;background:#fbfdff}.section{display:none}.section.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.panel h2{margin:0 0 12px;font-size:19px}.panel p{color:var(--muted);line-height:1.55}.intro{background:linear-gradient(135deg,#f8fbff,#edf6ff);border-color:#cfe2f7}.intro h2{font-size:23px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.kpi .label{font-size:13px;color:var(--muted);font-weight:900}.kpi .value{font-size:27px;font-weight:900;margin:8px 0}.kpi .desc{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.progressRow{display:grid;grid-template-columns:130px 1fr 58px;gap:12px;align-items:center;margin:12px 0}.bar{height:11px;background:#e9eef5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#45b8e8);border-radius:999px}.progressRow b{font-size:13px}.progressRow em{font-style:normal;text-align:right;color:var(--muted);font-size:13px;font-weight:900}.scopeTabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.scopeTab{border:1px solid #bfd1e6;background:#fff;color:var(--brand);border-radius:999px;padding:10px 13px;font-weight:900}.scopeTab.active{background:var(--brand);color:white}.domainGuide{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:stretch}.guideBox{border-radius:16px;padding:15px;background:#f7fbff;border:1px solid #d9e8f7}.guideBox b{display:block;margin-bottom:7px}.guideBox span{font-size:13px;color:var(--muted);line-height:1.45}.groupBlock{border:1px solid var(--line);border-radius:18px;background:white;margin-top:14px;overflow:hidden}.groupHead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:15px 16px;background:#f7faff;border-bottom:1px solid var(--line)}.groupHead h3{margin:0;font-size:16px}.groupHead span{font-size:12px;color:var(--muted);font-weight:900}.entryGrid{display:grid;gap:12px;padding:14px}.entryCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.entryTop{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:12px}.entryTop h4{margin:0 0 6px;font-size:15px}.entryTop p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.entryFields{display:grid;grid-template-columns:130px 1fr 1fr 1.2fr auto;gap:8px;align-items:end}.entryFields.ghgFields{grid-template-columns:1fr 1fr 1fr 1.3fr 1.3fr 1fr auto}.entryFields .field input,.entryFields .field select{padding:10px}.unitBox{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f8fbff;font-weight:900;color:#43566d;text-align:center}.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;white-space:nowrap}.done{background:var(--greenSoft);color:var(--green)}.valueOnly{background:var(--blueSoft);color:var(--brand2)}.miss{background:var(--redSoft);color:var(--red)}.chip{display:inline-flex;align-items:center;border-radius:999px;background:#eef3f8;color:#4d5f75;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.task{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fbfdff;margin-bottom:10px}.task b{display:block}.task span{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:separate;border-spacing:0}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:white}th,td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:middle}th{background:#f7faff;color:#48596f;font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}.empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:white;padding:14px 16px;border-radius:14px;box-shadow:0 16px 45px rgba(0,0,0,.25);display:none;z-index:20}.toast.show{display:block}@media(max-width:1200px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.main{padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.domainGuide{grid-template-columns:1fr}.entryFields,.entryFields.ghgFields{grid-template-columns:1fr 1fr}.entryFields .saveWrap{grid-column:1/-1}.entryFields .saveWrap .btn{width:100%}}@media(max-width:700px){.topbar{flex-direction:column}.tools,.btn{width:100%}.filters,.kpis,.entryFields,.entryFields.ghgFields{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.main{padding:14px}.sidebar{padding:16px}.panel{padding:16px}.task{grid-template-columns:1fr}.entryTop{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logoMark">S</div><div><b>SEMS-T</b><span>ESG Data Hub<br/>Area-based Input</span></div></div>
      <div class="nav" id="nav"></div>
      <div class="sideNote"><b>입력 방식</b><br/>공통 입력창이 아니라 <b>분야별 입력 공간</b>에서 담당 부서가 자기 업무 화면만 보고 입력합니다.<br/><br/>온실가스는 Scope 1·2·3, 활동자료, 배출계수, 계수 출처까지 별도로 관리합니다.</div>
    </aside>
    <main class="main">
      <div class="topbar"><div><h1 id="pageTitle">대시보드</h1><p id="pageSub">지속가능경영보고서 데이터를 분야별로 입력·증빙·검토합니다.</p></div><div class="tools"><button class="btn secondary" id="exportBtn">데이터 내보내기</button><button class="btn secondary" id="importBtn">데이터 불러오기</button><input class="hidden" id="importFile" type="file" accept="application/json" /></div></div>
      <div class="filters"><div class="field"><label>기준연도</label><select id="year"></select></div><div class="field"><label>기준월</label><select id="month"></select></div><div class="field"><label>회사</label><select id="company"></select></div><div class="field"><label>사업장</label><select id="site"></select></div></div>
      <div id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="assets/esg_area_input_app.js?v=20260709"></script>
</body>
</html>
